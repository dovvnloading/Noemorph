version: 2
updates:
  # Keep CI action majors reviewable on their own, while grouping routine updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Use fixed group names across both manifests for repeated dependencies.
  # Avoid dynamic group-by names until Dependabot's rebase bug is resolved.
  - package-ecosystem: "pip"
    directories:
      - "/Noemorph"
      - "/Noemorph/research"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    groups:
      python-numpy:
        patterns:
          - "numpy"
      python-pypdf:
        patterns:
          - "pypdf"
      python-web-runtime:
        patterns:
          - "fastapi"
          - "uvicorn"
      python-routine:
        patterns:
          - "*"
        exclude-patterns:
          - "fastapi"
          - "uvicorn"
          - "pythonnet"
        update-types:
          - "minor"
          - "patch"

  # React and its DOM/types packages must move together to satisfy peer deps.
  # Keep Sigma and other major frontend upgrades individually reviewable.
  - package-ecosystem: "npm"
    directory: "/Noemorph/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 3
    groups:
      react-runtime-and-types:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "sigma"
          - "@sigma/*"
        update-types:
          - "minor"
          - "patch"

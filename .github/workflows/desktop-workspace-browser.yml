name: Desktop workspace browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-web-browser:
    name: Desktop workspace optional API failures (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Noemorph/frontend/package-lock.json
      - name: Install locked frontend dependencies and build
        working-directory: Noemorph/frontend
        run: |
          npm ci
          npm run build
      - name: Install pinned browser test runtime
        run: npm install --no-save --prefix Noemorph/frontend @playwright/test@1.65.0 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: ./Noemorph/frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Test optional failure and recovery in real desktop and mobile Chromium
        run: ./Noemorph/frontend/node_modules/.bin/playwright test --config=Noemorph/frontend/playwright.config.mjs
      - name: Retain failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-workspace-browser-debug
          path: |
            Noemorph/frontend/playwright-report/
            Noemorph/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

name: Desktop workspace browser tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch'
    # Chromium runs only on an explicit manual dispatch. Automatic events
    # retain the required check names with an honest skipped conclusion.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_IF: '^(Noemorph/frontend/|\.github/workflows/desktop-workspace-browser\.yml$)'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  desktop-web-browser:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.browser == 'true'
    name: Desktop workspace optional API failures (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Noemorph/frontend/package-lock.json
      - name: Install locked frontend dependencies and build
        working-directory: Noemorph/frontend
        run: |
          npm ci
          npm run build
      - name: Install pinned browser test runtime
        run: npm install --no-save --prefix Noemorph/frontend @playwright/test@1.65.0 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: ./Noemorph/frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Test optional failure and recovery in real desktop and mobile Chromium
        run: ./Noemorph/frontend/node_modules/.bin/playwright test --config=Noemorph/frontend/playwright.config.mjs
      - name: Retain failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-workspace-browser-debug
          path: |
            Noemorph/frontend/playwright-report/
            Noemorph/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

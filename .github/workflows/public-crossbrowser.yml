name: Public Firefox and WebKit exploratory tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_IF: '^(public-site/|Noemorph/data/|Noemorph/backend/catalog|\.github/workflows/(browser-e2e|public-crossbrowser)\.yml$)'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  public-crossbrowser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Public Firefox/WebKit discovery (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate the validated public export
        run: python public-site/build.py
      - name: Install pinned browser test runtime
        run: npm install --no-save --prefix public-site @playwright/test@1.65.0 @axe-core/playwright@4.14.0
      - name: Install Firefox and WebKit with system dependencies
        run: ./public-site/node_modules/.bin/playwright install --with-deps firefox webkit
      - name: Exercise critical public reader journeys in Firefox and WebKit
        id: crossbrowser
        continue-on-error: true
        run: ./public-site/node_modules/.bin/playwright test --config=public-site/playwright.crossbrowser.config.mjs
      - name: Report exploratory result
        if: always()
        env:
          RESULT: ${{ steps.crossbrowser.outcome }}
        run: |
          if [ "$RESULT" = "failure" ]; then
            echo "::warning::Firefox/WebKit discovery failed; inspect traces and triage before making this a required check."
            echo "### Firefox/WebKit exploratory regression: FAIL (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "The Chromium quality gate is unchanged. Reproduce failures before promoting this check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Firefox/WebKit exploratory regression: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain failure reports, traces and screenshots
        if: steps.crossbrowser.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: public-firefox-webkit-debug
          path: |
            public-site/playwright-report/
            public-site/test-results/
          retention-days: 7
          if-no-files-found: ignore

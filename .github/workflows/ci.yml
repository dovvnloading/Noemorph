name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Noemorph/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r Noemorph/requirements.txt httpx==0.28.1
      - name: Run unit tests
        working-directory: Noemorph
        run: python -m unittest discover -s tests -v

  public-export:
    name: Public export and coverage integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Rebuild public catalog from validated sources
        run: python public-site/build.py
      - name: Check published catalog and current coverage counts
        run: python -m unittest discover -s public-site/tests -p 'test_*.py' -v
      - name: Check deterministic profile quality report
        run: python Noemorph/research/build_profile_quality_report.py --check
      - name: Package rendered static preview for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: noemorph-public-ux-preview
          path: public-site/dist/
          if-no-files-found: error
          retention-days: 5

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Noemorph/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Noemorph/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  public-site-smoke:
    name: Public site smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public JavaScript syntax
        run: |
          node --check public-site/dist/app.js
          node --check public-site/dist/discovery.js
          node --check public-site/dist/atlas.js
      - name: Exercise public catalog filters, links, and exports
        run: node --test public-site/tests/*.test.mjs

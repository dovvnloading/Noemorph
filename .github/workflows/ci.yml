name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Noemorph/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r Noemorph/requirements.txt httpx==0.28.1
      - name: Run unit tests
        working-directory: Noemorph
        run: python -m unittest discover -s tests -v

  python-quality:
    name: Python critical lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.1
      - name: Check undefined names and critical Python errors
        run: ruff check --select E9,F63,F7,F82 Noemorph research public-site

  dependency-audit:
    name: Dependency advisory baseline (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.9.0
      - name: Audit locked Python application dependencies
        continue-on-error: true
        run: pip-audit -r Noemorph/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit JavaScript production dependencies
        working-directory: Noemorph/frontend
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  public-export:
    name: Public export and coverage integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Rebuild public catalog from validated sources
        run: python public-site/build.py
      - name: Check published catalog and current coverage counts
        run: python -m unittest discover -s public-site/tests -p 'test_*.py' -v
      - name: Check deterministic profile quality report
        run: python Noemorph/research/build_profile_quality_report.py --check
      - name: Generate data quality audit
        run: |
          python Noemorph/research/audit_data_quality.py --output data-quality.json
          python Noemorph/research/audit_data_quality.py --output data-quality.json --check
      - name: Upload read-only quality report
        uses: actions/upload-artifact@v4
        with:
          name: noemorph-data-quality-report
          path: data-quality.json
          retention-days: 14
      - name: Package rendered static preview for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: noemorph-public-ux-preview
          path: public-site/dist/
          if-no-files-found: error
          retention-days: 5

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Noemorph/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Noemorph/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  public-site-smoke:
    name: Public site smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check public JavaScript syntax
        run: |
          node --check public-site/dist/app.js
          node --check public-site/dist/discovery.js
          node --check public-site/dist/atlas.js
      - name: Exercise public catalog filters, links, and exports
        run: node --test public-site/tests/*.test.mjs

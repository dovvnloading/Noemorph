name: Public real-browser tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch'
    # Chromium runs only on an explicit manual dispatch. Automatic events
    # retain the required check names with an honest skipped conclusion.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_IF: '^(public-site/|Noemorph/data/|Noemorph/backend/catalog|\.github/workflows/(browser-e2e|public-crossbrowser)\.yml$)'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  public-browser:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.browser == 'true'
    name: Playwright public reader (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate the current validated public export
        run: python public-site/build.py
      - name: Install pinned browser test runtime
        run: npm install --no-save --prefix public-site @playwright/test@1.65.0 @axe-core/playwright@4.14.0
      - name: Install Chromium and system dependencies
        run: ./public-site/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise public reader in real desktop/mobile Chromium
        run: ./public-site/node_modules/.bin/playwright test --config=public-site/playwright.config.mjs
      - name: Retain traces and screenshots when the run fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-browser-debug
          path: |
            public-site/playwright-report/
            public-site/test-results/
          retention-days: 7
          if-no-files-found: ignore
